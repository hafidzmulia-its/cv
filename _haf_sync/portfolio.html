    <meta property="og:title" content="Portfolio — Hafidz Mulia | Complete Project Catalog">
    <meta property="og:description" content="Searchable catalog of all projects. Filter by Next.js, Laravel, GIS, health-tech, education and more.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://hafmul.site/portfolio.html">
    <meta property="og:image" content="img/profile.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/logo.png">
    <style>
        .portfolio-hero{padding:7rem 0 2rem;background:var(--gradient-subtle);text-align:center}
        .portfolio-hero h1{font-size:clamp(2rem,4vw,3rem);font-weight:700;margin-bottom:.5rem}
        .portfolio-hero p{max-width:720px;margin:0 auto 1.5rem;color:var(--muted-foreground);font-size:1.05rem}
        .portfolio-toolbar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
        .portfolio-search{flex:1 1 280px;max-width:520px;position:relative}
        .portfolio-search input{width:100%;height:3rem;padding:0 1rem 0 2.6rem;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:.95rem;outline:none;transition:var(--transition-smooth);box-shadow:0 8px 24px rgba(15,23,42,.04)}
        .portfolio-search input:focus{border-color:rgba(124,58,237,.35);box-shadow:0 8px 24px rgba(124,58,237,.12)}
        .portfolio-search svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted-foreground)}
        .portfolio-sort{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
        .portfolio-sort label{font-size:.85rem;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.06em}
        .portfolio-sort select{height:3rem;border-radius:999px;border:1px solid var(--border);padding:0 1rem;background:#fff;font-weight:600;min-width:160px}
        .portfolio-meta{color:var(--muted-foreground);font-weight:600;font-size:.95rem;white-space:nowrap}
        .portfolio-empty{grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--muted-foreground);background:#fff;border:1px dashed var(--border);border-radius:1rem}
        .share-bar{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem}
        .share-bar button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:.55rem 1rem;font-weight:600;font-size:.85rem;cursor:pointer}
        .share-bar button:hover{border-color:rgba(124,58,237,.3);color:var(--primary)}
        @media(max-width:767px){.portfolio-toolbar{flex-direction:column;align-items:stretch}.portfolio-search{max-width:100%}}
    </style>
</head>
<body>
    <div id="site-header"></div>

    <!-- <header class="portfolio-hero">
        <div class="container">
            <h1 class="font-montserrat">Full <span class="text-gradient">Portfolio</span></h1>
            <p>Searchable catalog of all shipped projects — education, GIS, health-tech, internal systems. Filter by stack or search by keyword.</p>
            <div class="share-bar">
                <button id="clear-filter-btn" type="button">Clear filters</button>
                <a href="index.html#projects" style="text-decoration:none;"><button type="button">← Back to home</button></a>
            </div>
        </div>
    </header> -->

    <main class="section-bg" style="padding-top:5rem;">
        <div class="container">
            
            <div class="portfolio-toolbar">
                
                <div class="portfolio-search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    <input id="portfolio-search" type="search" placeholder="Search by title, stack, summary, role… (e.g. Next.js, Laravel, GIS)" autocomplete="off">
                </div>
                <div class="portfolio-sort">
                    <label for="portfolio-sort">Sort</label>
                    <select id="portfolio-sort">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="az">A → Z</option>
                        <option value="za">Z → A</option>
                    </select>
                    <span class="portfolio-meta" id="portfolio-count">—</span>
                </div>
            </div>
            <div class="project-filter-bar" id="portfolio-filter-bar" aria-label="Portfolio categories"></div>
            <div class="projects-grid" id="portfolio-grid"></div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/layout.js"></script>
    <script src="js/project-data.js"></script>
    <script src="js/portfolio.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
